# mise global configuration
# https://mise.jdx.dev/configuration.html
#
# `mise install` (or any command in a directory) will install everything below.
# Per-project tools go in `mise.toml` / `.tool-versions` inside the repo.

[tools]
node = "lts"
bun = "latest"

# Global npm CLIs (replacement for previous `volta install`).
# Add more with: mise use -g npm:<package>
"npm:@antfu/ni" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:difit" = "latest"
"npm:pnpm" = "latest"

# Hooks
# mise install / upgrade で node を入れ替えると node bin の corepack shim
# (yarn, pnpm) が消えるため、postinstall で必ず再生成する。
# corepack enable は idempotent なので毎回走らせて安全。
[hooks]
postinstall = "corepack enable"
